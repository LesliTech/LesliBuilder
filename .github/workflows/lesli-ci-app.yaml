# Test and scan the Lesli Rails host application through LesliActions.

name: "Lesli CI"

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: "Test Rails host application"
    uses: LesliTech/LesliActions/.github/workflows/lesli-ci-app.yaml@master
    with:
      ruby-version: "3.3.5"
      run-security: true
      run-system-tests: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  postgresql:
    name: "Test Rails host application with PostgreSQL"
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lesli_builder_test
      RAILS_ENV: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lesli_builder_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lesli_builder_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "Checkout application repository"
        uses: actions/checkout@v4

      - name: "Install Ruby and gems"
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: "Prepare PostgreSQL test database"
        run: bin/rails db:prepare

      - name: "Run application tests"
        run: bin/rails test

      - name: "Run application system tests"
        run: bin/rails test:system
